apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pingpong
  namespace: exercises
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pingpong
  strategy:
    canary:
      steps:
      - setWeight: 50
      - pause:
          duration: 30s
      - analysis:
          templates:
          - templateName: pingpong-cpu-usage
      - setWeight: 100
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
      - name: pingpong
        image: pingpong-db:v1  # Update to new version for canary
        ports:
        - containerPort: 3001
        env:
        - name: POSTGRES_HOST
          value: postgres-service.exercises
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: pingpongdb
        - name: POSTGRES_USER
          value: pingponguser
        - name: POSTGRES_PASSWORD
          value: pingpongpass
        readinessProbe:
          httpGet:
            path: /count
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
