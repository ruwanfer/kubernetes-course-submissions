apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummysite-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummysite-controller
  template:
    metadata:
      labels:
        app: dummysite-controller
    spec:
      containers:
      - name: controller
        image: nginx:alpine
        command: ["sh", "-c", "echo 'DummySite Controller would run here' && sleep 3600"]
