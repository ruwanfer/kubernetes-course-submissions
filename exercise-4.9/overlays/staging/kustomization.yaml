apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: project-staging
namePrefix: staging-
commonLabels:
  environment: staging

resources:
- ../../base

patchesStrategicMerge:
- deployment-patch.yaml
- configmap-patch.yaml
- ingress-patch.yaml

images:
- name: PROJECT/IMAGE
  newName: yourusername/the-project
  newTag: latest

replacements:
- source:
    kind: ConfigMap
    name: project-config
    fieldPath: data.API_BASE_URL
  targets:
  - select:
      kind: Deployment
      name: the-project
    fieldPaths:
    - spec.template.spec.containers.[name=frontend].env.[name=API_BASE_URL].value
