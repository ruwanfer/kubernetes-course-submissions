apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-deployment-rwx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: project-app-rwx
  template:
    metadata:
      labels:
        app: project-app-rwx
    spec:
      containers:
      - name: project-container
        image: nginx:alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: project-pvc-rwx
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: project-pvc-rwx
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
