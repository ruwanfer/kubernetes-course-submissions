name: GitOps for Log Output App

on:
  push:
    paths:
      - 'log-output-multi/**'
      - 'exercise-4.7/**'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push Docker image
      run: |
        cd log-output-multi
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/log-output-multi:$GITHUB_SHA .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/log-output-multi:$GITHUB_SHA
        
    - name: Set up Kustomize
      uses: imranismail/setup-kustomize@v2
      
    - name: Update image in manifests
      run: |
        cd exercise-4.7
        kustomize edit set image PROJECT/IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/log-output-multi:$GITHUB_SHA
        
    - name: Commit updated manifests
      uses: EndBug/add-and-commit@v9
      with:
        add: 'exercise-4.7/kustomization.yaml'
        message: "GitOps: Update Log output image to $GITHUB_SHA"
