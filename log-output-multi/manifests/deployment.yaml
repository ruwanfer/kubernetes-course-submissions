apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-multi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output-multi
  template:
    metadata:
      labels:
        app: log-output-multi
    spec:
      containers:
      - name: reader
        image: k3d-k3s-default-registry:5000/log-reader:v2
        ports:
        - containerPort: 3000
