apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster-dep
spec:
  replicas: 6  # Test with 6 replicas as required
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
      - name: broadcaster
        image: broadcaster:latest
        ports:
        - containerPort: 8080
        env:
        - name: NATS_URL
          value: nats://my-nats:4222
        - name: WEBHOOK_URL
          valueFrom:
            configMapKeyRef:
              name: broadcaster-config
              key: WEBHOOK_URL
        - name: SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
