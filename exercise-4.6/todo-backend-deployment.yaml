apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-nats
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend-nats
  template:
    metadata:
      labels:
        app: todo-backend-nats
    spec:
      containers:
      - name: todo-backend
        image: todo-backend:v3  # Updated version with NATS
        ports:
        - containerPort: 3002
        env:
        - name: NATS_URL
          value: nats://my-nats.default.svc.cluster.local:4222
        - name: PORT
          value: "3002"
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
